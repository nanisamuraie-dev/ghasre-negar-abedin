<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1">

    <title>Ghasr Negar AR</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #startButton {
            position: fixed;
            z-index: 9999;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 18px 35px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            background: black;
            color: white;
        }

        #status {
            position: fixed;
            z-index: 9999;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <button id="startButton">START AR</button>

    <div id="status">Press START AR</div>

    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind; warmupTolerance: 3; missTolerance: 10; filterMinCF: 0.0003; filterBeta: 3000;"
        color-space="sRGB"
        renderer="colorManagement: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets timeout="15000">

            <video
                id="myVideo"
                src="./video.mp4"
                preload="auto"
                muted
                playsinline
                webkit-playsinline
                crossorigin="anonymous"
                loop>
            </video>

        </a-assets>

        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

        <a-entity
            id="myTarget"
            mindar-image-target="targetIndex: 0">

            <a-video
                id="arVideo"
                src="#myVideo"
                material="shader: flat; side: double"
                position="0 0 0"
                width="1"
                height="0.5625">
            </a-video>

        </a-entity>

    </a-scene>

    <script>
        // LIVE TUNING: add values to the link to test them without editing the file, e.g.
        //   https://.../ghasre-negar-abedin/?cf=0.0005&beta=3000
        //   cf   = filterMinCF  (lower = less jitter)
        //   beta = filterBeta   (higher = less lag when moving)
        //   miss = missTolerance, warm = warmupTolerance
        window.tune = { warmupTolerance: 3, missTolerance: 10, filterMinCF: 0.0003, filterBeta: 3000 };
        (function () {
            var q = new URLSearchParams(location.search);
            var map = { cf: "filterMinCF", beta: "filterBeta", miss: "missTolerance", warm: "warmupTolerance" };
            Object.keys(map).forEach(function (k) {
                if (q.has(k) && !isNaN(parseFloat(q.get(k)))) window.tune[map[k]] = parseFloat(q.get(k));
            });
            var t = window.tune;
            document.querySelector("a-scene").setAttribute("mindar-image",
                "imageTargetSrc: ./targets.mind; warmupTolerance: " + t.warmupTolerance +
                "; missTolerance: " + t.missTolerance + "; filterMinCF: " + t.filterMinCF +
                "; filterBeta: " + t.filterBeta + ";");
        })();
    </script>


    <script>

        const video = document.querySelector("#myVideo");

        const target = document.querySelector("#myTarget");

        const button = document.querySelector("#startButton");

        const status = document.querySelector("#status");

        let videoReady = false;

        let targetVisible = false;


        // VIDEO LOADING

        video.addEventListener("loadeddata", function() {

            videoReady = true;

            console.log("Video loaded successfully");

        });


        video.addEventListener("error", function() {

            console.error("VIDEO ERROR:", video.error);

            status.textContent = "Video loading failed.";

        });


        // Runs as soon as the video has loaded: warns if the picture can't be decoded
        video.addEventListener("loadedmetadata", function() {
            if (video.videoWidth === 0) {
                status.textContent = "VIDEO CODEC NOT SUPPORTED - re-encode as H.264 8-bit";
            } else if (button.style.display !== "none") {
                status.textContent = "[v8] Press START AR - Video OK " + video.videoWidth + "x" + video.videoHeight
                    + " | cf " + window.tune.filterMinCF + " beta " + window.tune.filterBeta;
            }
        });


        // START AR BUTTON - one tap at the beginning. This tap is what lets Chrome play SOUND later.
        // After it, everything is automatic (play when image found, pause when lost).
        button.addEventListener("click", async function() {
            button.style.display = "none";
            status.textContent = "Looking for image...";

            try {
                video.muted = true;
                await video.play();      // unlock the video with the user's tap
                video.pause();           // wait for the image before really playing
                video.currentTime = 0;
                video.muted = false;     // allowed now: sound will be on when the image is found
            } catch (error) {
                console.error("INITIALIZATION ERROR:", error);
            }
        });


        // WAIT FOR VIDEO TO BE READY

        async function waitForVideo() {

            if (video.readyState >= 2) {
                return;
            }

            await new Promise((resolve, reject) => {

                video.addEventListener("loadeddata", resolve, {once: true});

                video.addEventListener("error", reject, {once: true});

            });

        }


        // IMAGE DETECTED

        target.addEventListener("targetFound", async function() {

            targetVisible = true;

            status.textContent = "Image detected! Playing video...";

            console.log("TARGET FOUND");


            try {

                await waitForVideo();

                if (!targetVisible) return;

                // NOTE: no "currentTime = 0" here on purpose, so the video RESUMES
                // from where it stopped when the image comes back into view.

                // Try to play WITH sound. Chrome only allows that after the person has tapped the page once.
                // If it refuses, play muted automatically; the first tap anywhere then turns the sound on.
                video.muted = false;
                try {
                    await video.play();
                } catch (e) {
                    video.muted = true;
                    await video.play();
                }

                console.log("VIDEO PLAYBACK STARTED, muted:", video.muted);

                console.log("Video dimensions:",
                    video.videoWidth,
                    video.videoHeight
                );

                console.log("Video ready state:", video.readyState);

                console.log("Video paused:", video.paused);

                status.textContent = video.videoWidth === 0
                    ? "VIDEO CODEC NOT SUPPORTED - re-encode as H.264 8-bit"
                    : "Video playing! " + video.videoWidth + "x" + video.videoHeight
                      + " | sound: " + (video.muted ? "OFF - tap screen" : "ON")
                      + " | vol " + video.volume;

            }

            catch(error) {

                console.error("PLAYBACK ERROR:", error);

                status.textContent = "Unable to play video.";

            }

        });


        // FALLBACK: any tap on the screen unmutes the video (a fresh user gesture always allows sound)
        ["pointerup", "touchend", "click"].forEach(function(evt) {
            document.addEventListener(evt, function() {
                if (video.muted) {
                    video.muted = false;
                    video.volume = 1;
                    console.log("Unmuted by tap");
                }
            });
        });


        // IMAGE LOST

        target.addEventListener("targetLost", function() {

            targetVisible = false;

            video.pause();

            status.textContent = "Looking for image...";

            console.log("TARGET LOST");

        });


        // CAMERA ERROR

        document.querySelector("a-scene")
            .addEventListener("arError", function(event) {

                console.error("AR ERROR:", event);

                status.textContent = "Camera error. Check permissions.";

            });


    </script>

</body>
</html>
