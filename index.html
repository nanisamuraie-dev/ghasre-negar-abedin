<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1">

    <title>Ghasr Negar AR</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #startButton {
            position: fixed;
            z-index: 9999;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 18px 35px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            background: black;
            color: white;
        }

        #status {
            position: fixed;
            z-index: 9999;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <button id="startButton">START AR</button>

    <div id="status">Press START AR</div>

    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind;"
        color-space="sRGB"
        renderer="colorManagement: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets timeout="15000">

            <video
                id="myVideo"
                src="./video.mp4"
                preload="auto"
                muted
                playsinline
                webkit-playsinline
                crossorigin="anonymous"
                loop>
            </video>

        </a-assets>

        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

        <a-entity
            id="myTarget"
            mindar-image-target="targetIndex: 0">

            <a-video
                id="arVideo"
                src="#myVideo"
                material="shader: flat; side: double"
                position="0 0 0"
                width="1"
                height="0.5625">
            </a-video>

        </a-entity>

    </a-scene>


    <script>

        const video = document.querySelector("#myVideo");

        const target = document.querySelector("#myTarget");

        const button = document.querySelector("#startButton");

        const status = document.querySelector("#status");

        let videoReady = false;

        let targetVisible = false;


        // VIDEO LOADING

        video.addEventListener("loadeddata", function() {

            videoReady = true;

            console.log("Video loaded successfully");

        });


        video.addEventListener("error", function() {

            console.error("VIDEO ERROR:", video.error);

            status.textContent = "Video loading failed.";

        });


        // START AR BUTTON

        button.addEventListener("click", async function() {

            try {

                video.muted = true;

                video.playsInline = true;

                // Initialize video playback through user interaction.
                // Keep it playing instead of immediately pausing it.

                await video.play();

                button.style.display = "none";

                // DIAGNOSTIC: videoWidth = 0 means the phone can play the audio but CANNOT decode the video picture
                // (typical for H.265/HEVC or 10-bit exports) -> black screen with no error.
                if (video.videoWidth === 0) {
                    status.textContent = "VIDEO CODEC NOT SUPPORTED - re-encode as H.264 8-bit";
                } else {
                    status.textContent = "Camera starting... Video OK " + video.videoWidth + "x" + video.videoHeight;
                }

                // Video is now unlocked by the tap. Stop it so it doesn't play (with sound)
                // before the image is found; targetFound will start it from the beginning.
                video.pause();
                video.currentTime = 0;

                console.log("Video initialized successfully");

            }

            catch(error) {

                console.error("INITIALIZATION ERROR:", error);

                status.textContent = "Video initialization failed.";

            }

        });


        // WAIT FOR VIDEO TO BE READY

        async function waitForVideo() {

            if (video.readyState >= 2) {
                return;
            }

            await new Promise((resolve, reject) => {

                video.addEventListener("loadeddata", resolve, {once: true});

                video.addEventListener("error", reject, {once: true});

            });

        }


        // IMAGE DETECTED

        target.addEventListener("targetFound", async function() {

            targetVisible = true;

            status.textContent = "Image detected! Playing video...";

            console.log("TARGET FOUND");


            try {

                await waitForVideo();

                if (!targetVisible) return;

                video.currentTime = 0;

                // Turn sound on (allowed because the user already tapped START AR).
                // If the browser refuses, fall back to muted so the video still plays.
                video.muted = false;
                try {
                    await video.play();
                } catch (e) {
                    video.muted = true;
                    await video.play();
                }

                console.log("VIDEO PLAYBACK STARTED, muted:", video.muted);

                console.log("Video dimensions:",
                    video.videoWidth,
                    video.videoHeight
                );

                console.log("Video ready state:", video.readyState);

                console.log("Video paused:", video.paused);

                status.textContent = video.videoWidth === 0
                    ? "VIDEO CODEC NOT SUPPORTED - re-encode as H.264 8-bit"
                    : "Video playing! " + video.videoWidth + "x" + video.videoHeight;

            }

            catch(error) {

                console.error("PLAYBACK ERROR:", error);

                status.textContent = "Unable to play video.";

            }

        });


        // IMAGE LOST

        target.addEventListener("targetLost", function() {

            targetVisible = false;

            video.pause();

            status.textContent = "Looking for image...";

            console.log("TARGET LOST");

        });


        // CAMERA ERROR

        document.querySelector("a-scene")
            .addEventListener("arError", function(event) {

                console.error("AR ERROR:", event);

                status.textContent = "Camera error. Check permissions.";

            });


    </script>

</body>
</html>
